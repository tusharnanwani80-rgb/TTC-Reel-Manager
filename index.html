<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>TTC Reels Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue:#4361EE; --orange:#FF6B35; --lime:#C8FF00; --pink:#FF3D8A; --white:#fff; --off:#F5F4FF; --dark:#111118; --grey:#6B6B80; --red:#E5383B; }
    body { font-family:'DM Sans',sans-serif; background:#F8F9FA; background-image:radial-gradient(rgba(67,97,238,.06) 1px,transparent 1px); background-size:24px 24px; color:var(--dark); min-height:100vh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .wrap { max-width:860px; margin:0 auto; padding:18px 14px 60px; }
    header.top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; }
    h1 { font-family:'Righteous',cursive; font-size:24px; }
    h1 span { color:var(--blue); }
    .btn { font:800 13px 'DM Sans',sans-serif; background:var(--white); color:var(--dark); border:2px solid var(--dark); border-radius:50px; padding:9px 16px; cursor:pointer; box-shadow:2px 2px 0 var(--dark); transition:transform .15s, box-shadow .15s; }
    .btn:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--dark); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.primary { background:var(--blue); color:var(--white); }
    .btn.danger { background:var(--red); color:var(--white); }
    .btn.sm { padding:6px 11px; font-size:12px; }
    .card { background:var(--white); border:2.5px solid var(--dark); border-radius:20px; padding:20px; box-shadow:6px 6px 0 var(--dark); margin-bottom:20px; }
    .card h2 { font-family:'Righteous',cursive; font-size:20px; margin-bottom:14px; }
    label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:var(--grey); margin:12px 0 5px; }
    input[type=text], input[type=password], input[type=url] { width:100%; font:600 15px 'DM Sans',sans-serif; padding:12px 14px; border:2px solid var(--dark); border-radius:12px; background:var(--white); outline:none; }
    input:focus { border-color:var(--blue); box-shadow:3px 3px 0 var(--blue); }
    input.bad { border-color:var(--red); }
    .err { color:var(--red); font-size:13px; font-weight:700; margin-top:5px; min-height:0; }
    .row2 { display:grid; grid-template-columns:1fr; gap:0 14px; }
    @media (min-width:640px) { .row2 { grid-template-columns:1fr 1fr; } }
    .preview { display:none; margin-top:10px; gap:12px; align-items:center; }
    .preview.show { display:flex; }
    .preview img { width:90px; aspect-ratio:9/16; object-fit:cover; border:2px solid var(--dark); border-radius:10px; background:var(--off); }
    .preview small { color:var(--grey); font-weight:700; font-size:12px; word-break:break-all; }
    .class-picks { display:flex; flex-wrap:wrap; gap:8px; }
    .cp { display:inline-flex; margin:0; text-transform:none; letter-spacing:0; cursor:pointer; }
    .cp input { position:absolute; opacity:0; pointer-events:none; }
    .cp span { font:800 13px 'DM Sans',sans-serif; color:var(--dark); border:2px solid var(--dark); border-radius:50px; padding:8px 14px; background:var(--white); transition:background .15s, transform .15s; }
    .cp input:checked + span { background:var(--lime); box-shadow:2px 2px 0 var(--dark); }
    .cp input:focus-visible + span { outline:3px solid var(--blue); outline-offset:2px; }
    .reel .meta span.tags { color:var(--blue); font-weight:800; }
    .switch-line { display:flex; align-items:center; gap:10px; margin-top:14px; font-weight:700; font-size:14px; }
    .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

    .reel { display:grid; grid-template-columns:auto 56px 1fr; gap:12px; align-items:center; padding:12px; border:2px solid var(--dark); border-radius:16px; background:var(--white); margin-bottom:12px; transition:box-shadow .15s, opacity .15s; }
    .reel.dragging { opacity:.4; }
    .reel.over { box-shadow:0 -4px 0 var(--blue); }
    .reel img { width:56px; aspect-ratio:9/16; object-fit:cover; border-radius:8px; border:2px solid var(--dark); background:var(--off); }
    .reel .meta { min-width:0; }
    .reel .meta b { font-size:16px; display:block; }
    .reel .meta span { display:block; font-size:13px; color:var(--grey); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .reel .tools { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-top:2px dashed rgba(107,107,128,.25); padding-top:10px; }
    .handle { cursor:grab; color:var(--grey); display:flex; flex-direction:column; align-items:center; gap:4px; touch-action:none; }
    .handle svg { width:18px; height:18px; }
    .updown { display:flex; flex-direction:column; gap:4px; }
    .updown button { width:26px; height:22px; border:2px solid var(--dark); border-radius:6px; background:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .updown button:disabled { opacity:.3; cursor:not-allowed; }
    .updown svg { width:12px; height:12px; }
    .spacer { flex:1; }
    .toggle { display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:12px; cursor:pointer; }
    .toggle input { display:none; }
    .toggle .track { width:42px; height:24px; border-radius:20px; border:2px solid var(--dark); background:#ddd; position:relative; transition:background .2s; }
    .toggle .track::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--dark); transition:transform .2s; }
    .toggle input:checked + .track { background:var(--lime); }
    .toggle input:checked + .track::after { transform:translateX(18px); }
    .empty { text-align:center; color:var(--grey); font-weight:700; padding:30px 10px; }
    .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:var(--dark); color:var(--white); padding:11px 18px; border-radius:40px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:all .3s; z-index:50; max-width:90vw; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.bad { background:var(--red); }
    #login { max-width:380px; margin:12vh auto 0; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>Admin login</h2>
    <form id="loginForm" autocomplete="on">
      <label for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <div class="actions"><button class="btn primary" type="submit" id="loginBtn">Log in</button></div>
    </form>
  </div>

  <!-- APP -->
  <div id="app" hidden>
    <header class="top">
      <h1>TTC <span>Reels</span></h1>
      <button class="btn sm" id="logoutBtn" type="button">Log out</button>
    </header>

    <div class="card" id="formCard">
      <h2 id="formTitle">Add reel</h2>
      <form id="reelForm" novalidate>
        <label for="link">YouTube link</label>
        <input type="text" id="link" placeholder="Paste youtube.com/shorts/..., youtu.be/... or watch?v=..." autocomplete="off">
        <div class="err" id="linkErr"></div>
        <div class="preview" id="preview">
          <img id="thumb" alt="Video thumbnail">
          <div><b style="font-size:13px">Is this the right video?</b><br><small id="idOut"></small></div>
        </div>

        <div class="row2">
          <div>
            <label for="title">Reel topic (class or subject)</label>
            <input type="text" id="title" maxlength="200" placeholder="Class 10 Maths">
            <div class="err" id="titleErr"></div>
          </div>
          <div>
            <label for="cta">Button label (enquiry button)</label>
            <input type="text" id="cta" maxlength="200" placeholder="Book a free demo class">
            <div class="err" id="ctaErr"></div>
          </div>
        </div>
        <label id="classesLabel">Classes this reel is for (pick all that apply)</label>
        <div class="class-picks" id="classPicks" role="group" aria-labelledby="classesLabel"></div>
        <div class="err" id="classesErr"></div>
        <label for="hook">Hook (headline on the reel)</label>
        <input type="text" id="hook" maxlength="200" placeholder="Score 90+ in Maths this board exam">
        <div class="err" id="hookErr"></div>
        <label for="caption">Caption (one line)</label>
        <input type="text" id="caption" maxlength="200" placeholder="Chapter-wise tricks and practice with Tushar Sir">
        <div class="err" id="captionErr"></div>
        <label for="ctaUrl">Quiz link for the button (optional)</label>
        <input type="text" id="ctaUrl" placeholder="https://yoursite.com/quizzes/integers/" autocomplete="off">
        <div class="err" id="ctaUrlErr"></div>
        <label for="ig">Instagram link (optional)</label>
        <input type="url" id="ig" placeholder="https://instagram.com/reel/...">
        <div class="err" id="igErr"></div>

        <div class="switch-line">
          <label class="toggle" style="margin:0;text-transform:none;letter-spacing:0;color:var(--dark);font-size:14px">
            <input type="checkbox" id="pub"><span class="track"></span> Published
          </label>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit" id="saveBtn">Save reel</button>
          <button class="btn" type="button" id="cancelBtn" hidden>Cancel edit</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>All reels</h2>
      <div id="list"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  // Paste your deployed Apps Script web app URL (ends with /exec).
  const API_URL = 'https://script.google.com/macros/s/AKfycbwwAbeZB3ZsKWHOGmWpVEmXa3EbcRNFnjv43Pai4OM6a8p9ibmIBl5Aotr-YCDMgtaVEg/exec';

  const $ = id => document.getElementById(id);
  let token = sessionStorage.getItem('ttc_reels_token') || '';
  let reels = [];
  let editingId = null;
  let currentYtId = '';
  let dragId = null;
  // Classes offered as tags. Add 11, 12 here if you start teaching them.
  const CLASS_OPTIONS = [6, 7, 8, 9, 10];

  const ICON = {
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'
  };

  /* ---------- API ---------- */
  async function api(payload) {
    if (!API_URL || API_URL.indexOf('PASTE_') === 0) throw new Error('Set API_URL first');
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(Object.assign({ token }, payload))
    });
    const data = await res.json();
    if (data && data.error === 'unauthorized') { logout(); throw new Error('Session expired. Log in again.'); }
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ---------- auth ---------- */
  function showApp() { $('login').hidden = true; $('app').hidden = false; loadList(); }
  function logout() {
    token = ''; sessionStorage.removeItem('ttc_reels_token');
    $('app').hidden = true; $('login').hidden = false; $('pw').value = '';
  }
  $('logoutBtn').onclick = logout;
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('loginErr').textContent = '';
    $('loginBtn').disabled = true;
    try {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', password: $('pw').value }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Login failed');
      token = data.token; sessionStorage.setItem('ttc_reels_token', token);
      showApp();
    } catch (err) { $('loginErr').textContent = err.message; }
    $('loginBtn').disabled = false;
  });

  /* ---------- YouTube ID extraction ---------- */
  const ID = '([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])';
  function extractYouTubeId(input) {
    const s = String(input || '').trim();
    if (!s) return '';
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s; // bare ID
    let m = s.match(new RegExp('(?:youtube(?:-nocookie)?\\.com/(?:shorts|embed|live|v)/|youtu\\.be/)' + ID));
    if (m) return m[1];
    m = s.match(new RegExp('[?&]v=' + ID));
    return m ? m[1] : '';
  }

  /* ---------- class tags ---------- */
  function buildPicks() {
    const box = $('classPicks');
    const checked = new Set(selectedClasses());
    const all = new Set(CLASS_OPTIONS);
    reels.forEach(r => (r.classes || []).forEach(n => all.add(n))); // never lose a tag already in use
    box.innerHTML = '';
    [...all].sort((a, b) => a - b).forEach(n => {
      const l = document.createElement('label'); l.className = 'cp';
      const i = document.createElement('input'); i.type = 'checkbox'; i.value = String(n); i.checked = checked.has(n);
      i.addEventListener('change', () => { if (selectedClasses().length) setErr('classes', ''); });
      const t = document.createElement('span'); t.textContent = 'Class ' + n;
      l.append(i, t); box.appendChild(l);
    });
  }
  function selectedClasses() {
    return [...document.querySelectorAll('#classPicks input:checked')].map(i => Number(i.value));
  }
  function setPicks(list) {
    const want = new Set(list || []);
    document.querySelectorAll('#classPicks input').forEach(i => { i.checked = want.has(Number(i.value)); });
  }
  buildPicks();

  /* ---------- form ---------- */
  function setErr(id, msg) {
    $(id + 'Err').textContent = msg || '';
    const inp = $(id === 'link' ? 'link' : id === 'cta' ? 'cta' : id === 'ig' ? 'ig' : id);
    if (inp) inp.classList.toggle('bad', !!msg);
  }
  function updatePreview() {
    const raw = $('link').value.trim();
    currentYtId = extractYouTubeId(raw);
    const p = $('preview');
    if (!raw) { setErr('link', ''); p.classList.remove('show'); return; }
    if (!currentYtId) {
      setErr('link', 'No valid 11-character YouTube ID found in this link.');
      p.classList.remove('show'); return;
    }
    setErr('link', '');
    $('thumb').src = 'https://img.youtube.com/vi/' + currentYtId + '/hqdefault.jpg';
    $('idOut').textContent = 'Video ID: ' + currentYtId;
    p.classList.add('show');
  }
  $('link').addEventListener('input', updatePreview);
  $('link').addEventListener('paste', () => setTimeout(updatePreview, 0));

  function resetForm() {
    editingId = null; currentYtId = '';
    $('reelForm').reset();
    $('preview').classList.remove('show');
    ['link', 'title', 'cta', 'hook', 'caption', 'ig', 'classes', 'ctaUrl'].forEach(k => setErr(k, ''));
    $('formTitle').textContent = 'Add reel';
    $('saveBtn').textContent = 'Save reel';
    $('cancelBtn').hidden = true;
  }
  $('cancelBtn').onclick = resetForm;

  function readForm() {
    return {
      id: editingId || '',
      title: $('title').value.trim(),
      hook: $('hook').value.trim(),
      caption: $('caption').value.trim(),
      cta_text: $('cta').value.trim(),
      youtube_id: currentYtId,
      classes: selectedClasses(),
      cta_url: $('ctaUrl').value.trim(),
      instagram_url: $('ig').value.trim(),
      is_published: $('pub').checked
    };
  }

  function validate(r) {
    let ok = true;
    const need = (key, el, msg) => { if (!r[key]) { setErr(el, msg); ok = false; } else setErr(el, ''); };
    need('title', 'title', 'Reel topic is required.');
    need('cta_text', 'cta', 'Button label is required.');
    need('hook', 'hook', 'Hook is required.');
    need('caption', 'caption', 'Caption is required.');
    if (!r.youtube_id) { setErr('link', 'Paste a valid YouTube link.'); ok = false; }
    if (!r.classes.length) { setErr('classes', 'Pick at least one class.'); ok = false; } else setErr('classes', '');
    if (r.instagram_url && !/^https:\/\/(www\.)?instagram\.com\/\S+$/i.test(r.instagram_url)) {
      setErr('ig', 'Must be a full https://instagram.com/... link.'); ok = false;
    } else setErr('ig', '');
    if (r.cta_url && !/^(https:\/\/\S+|\/(?!\/)\S*)$/.test(r.cta_url)) {
      setErr('ctaUrl', 'Use a full https:// link, or a path starting with /'); ok = false;
    } else setErr('ctaUrl', '');
    return ok;
  }

  $('reelForm').addEventListener('submit', async e => {
    e.preventDefault();
    const r = readForm();
    if (!validate(r)) return;
    $('saveBtn').disabled = true;
    try {
      await api({ action: 'save', reel: r });
      toast(editingId ? 'Reel updated' : 'Reel added');
      resetForm();
      await loadList();
    } catch (err) { toast(err.message, true); }
    $('saveBtn').disabled = false;
  });

  /* ---------- list ---------- */
  async function loadList() {
    try {
      const data = await api({ action: 'list' });
      reels = data.reels;
      buildPicks();
      renderList();
    } catch (err) { toast(err.message, true); }
  }

  function renderList() {
    const box = $('list');
    box.innerHTML = '';
    if (!reels.length) { box.innerHTML = '<div class="empty">No reels yet. Add your first one above.</div>'; return; }

    reels.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'reel';
      el.draggable = true;
      el.dataset.id = r.id;

      const handle = document.createElement('div');
      handle.className = 'handle';
      handle.title = 'Drag to reorder';
      handle.innerHTML = ICON.grip;

      const img = document.createElement('img');
      img.src = 'https://img.youtube.com/vi/' + r.youtube_id + '/hqdefault.jpg';
      img.alt = '';
      img.loading = 'lazy';

      const meta = document.createElement('div');
      meta.className = 'meta';
      const b = document.createElement('b'); b.textContent = r.title;
      const s1 = document.createElement('span'); s1.textContent = r.hook;
      const s2 = document.createElement('span'); s2.textContent = r.cta_text;
      const s3 = document.createElement('span'); s3.className = 'tags';
      s3.textContent = ((r.classes && r.classes.length) ? 'Classes: ' + r.classes.join(', ') : 'No class tag (shows only under All)') +
        '  |  Likes: ' + (r.likes || 0) + (r.cta_url ? '  |  Quiz link set' : '');
      meta.append(b, s1, s2, s3);

      const tools = document.createElement('div');
      tools.className = 'tools';

      const ud = document.createElement('div');
      ud.className = 'updown';
      const upB = document.createElement('button'); upB.type = 'button'; upB.innerHTML = ICON.up; upB.title = 'Move up'; upB.disabled = i === 0;
      const dnB = document.createElement('button'); dnB.type = 'button'; dnB.innerHTML = ICON.down; dnB.title = 'Move down'; dnB.disabled = i === reels.length - 1;
      upB.onclick = () => move(i, -1);
      dnB.onclick = () => move(i, 1);
      ud.append(upB, dnB);

      const tg = document.createElement('label');
      tg.className = 'toggle';
      tg.style.margin = '0';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = r.is_published;
      const tr = document.createElement('span'); tr.className = 'track';
      const tx = document.createElement('span'); tx.textContent = r.is_published ? 'Published' : 'Draft';
      tg.append(cb, tr, tx);
      cb.onchange = async () => {
        cb.disabled = true;
        try {
          await api({ action: 'setPublished', id: r.id, is_published: cb.checked });
          r.is_published = cb.checked; tx.textContent = cb.checked ? 'Published' : 'Draft';
        } catch (err) { cb.checked = !cb.checked; toast(err.message, true); }
        cb.disabled = false;
      };

      const sp = document.createElement('span'); sp.className = 'spacer';
      const ed = document.createElement('button'); ed.className = 'btn sm'; ed.type = 'button'; ed.textContent = 'Edit';
      ed.onclick = () => startEdit(r);
      const del = document.createElement('button'); del.className = 'btn sm danger'; del.type = 'button'; del.textContent = 'Delete';
      del.onclick = async () => {
        if (!confirm('Delete "' + r.title + '"? This cannot be undone.')) return;
        try { await api({ action: 'delete', id: r.id }); toast('Reel deleted'); if (editingId === r.id) resetForm(); loadList(); }
        catch (err) { toast(err.message, true); }
      };

      tools.append(ud, tg, sp, ed, del);
      el.append(handle, img, meta, tools);

      // drag to reorder (desktop)
      el.addEventListener('dragstart', ev => { dragId = r.id; el.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', r.id); });
      el.addEventListener('dragend', () => { dragId = null; el.classList.remove('dragging'); document.querySelectorAll('.reel.over').forEach(x => x.classList.remove('over')); });
      el.addEventListener('dragover', ev => { ev.preventDefault(); el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', ev => {
        ev.preventDefault(); el.classList.remove('over');
        if (!dragId || dragId === r.id) return;
        const from = reels.findIndex(x => x.id === dragId);
        const to = reels.findIndex(x => x.id === r.id);
        const [item] = reels.splice(from, 1);
        reels.splice(to, 0, item);
        persistOrder();
      });

      box.appendChild(el);
    });
  }

  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= reels.length) return;
    [reels[i], reels[j]] = [reels[j], reels[i]];
    persistOrder();
  }

  async function persistOrder() {
    renderList();
    try { await api({ action: 'reorder', ids: reels.map(r => r.id) }); toast('Order saved'); }
    catch (err) { toast(err.message, true); loadList(); }
  }

  function startEdit(r) {
    editingId = r.id;
    $('link').value = 'https://youtube.com/shorts/' + r.youtube_id;
    $('title').value = r.title; $('hook').value = r.hook; $('caption').value = r.caption;
    $('cta').value = r.cta_text; $('ig').value = r.instagram_url || ''; $('pub').checked = r.is_published;
    $('ctaUrl').value = r.cta_url || '';
    setPicks(r.classes);
    updatePreview();
    $('formTitle').textContent = 'Edit reel';
    $('saveBtn').textContent = 'Update reel';
    $('cancelBtn').hidden = false;
    $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  if (token) showApp();
</script>
</body>
</html>
